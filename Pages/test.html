<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToneVault - AI Track Transcriber</title>
    
    <!-- FONTAWESOME ICONS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ABCJS FOR MIDI GENERATION -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.2.2/abcjs-basic-min.js"></script>

    <!-- UNIVERSAL DESIGN EDITOR -->
    <link rel="stylesheet" href="/style.css">

    <style>
        .page-header {
            text-align: center;
            margin-top: 60px;
            margin-bottom: 30px;
            padding: 0 20px;
        }

        .page-header h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            margin-top: 0;
            color: #ffffff;
        }

        .page-header h1 span {
            color: #00d4ff;
        }

        .page-header p {
            color: #bbbbbb;
            font-size: 1.1rem;
            max-width: 750px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .tool-wrapper {
            width: 100%;
            max-width: 700px;
            margin: 0 auto 50px auto;
            padding: 0 20px;
        }

        .stem-card {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .setting-group label {
            display: block;
            color: #bbb;
            font-size: 0.9rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .setting-group input {
            width: 100%;
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.2s ease;
            box-sizing: border-box;
        }

        .setting-group input:focus {
            border-color: #00d4ff;
        }
        
        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, #00d4ff, #0077ff);
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }

        .action-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .action-btn:disabled {
            background: #333;
            color: #777;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        
        #statusMessage {
            margin-top: 25px;
            display: none;
        }

        .status-text {
            text-align: center;
            color: #00d4ff;
            font-size: 1.05rem;
            margin-bottom: 10px;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #0077ff, #00d4ff);
            transition: width 0.2s ease;
        }
        
        #resultsArea {
            margin-top: 30px;
            display: none;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 25px;
            text-align: center;
        }

        #resultsArea h3 {
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }
        
        /* ABCJS SPECIFIC BUTTON OVERRIDES */
        .abcjs-midi-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .abcjs-midi-container a {
            background: rgba(0, 212, 255, 0.1) !important;
            border: 1px solid rgba(0, 212, 255, 0.3) !important;
            color: #00d4ff !important;
            font-weight: 600 !important;
            border-radius: 8px !important;
            padding: 10px 24px !important;
            text-decoration: none !important;
            font-family: inherit !important;
            transition: all 0.2s ease;
        }

        .abcjs-midi-container a:hover {
            background: #00d4ff !important;
            color: #000 !important;
        }
        
        ::-webkit-scrollbar {
            display: none;
        }

        html {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .creator-credit {
            text-align: center;
            margin-top: 80px; 
            margin-bottom: 80px; 
            font-size: 0.9rem;
            color: #888;
            padding: 0 15px;
        }

        .creator-credit a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s ease;
        }

        .creator-credit a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .page-header h1 { font-size: 2rem; }
            .stem-card { padding: 20px; }
        }
    </style>
</head>
<body>

    <site-header></site-header>

    <main>
        <div class="page-header">
            <h1>Track to <span>MIDI</span></h1>
            <p>Input any famous album, movie, or track name, and the AI will recall the musical score and generate a downloadable MIDI file.</p>
        </div>

        <div class="tool-wrapper">
            <div class="stem-card">
                
                <div class="settings-grid">
                    <div class="setting-group">
                        <label for="albumInput"><i class="fa-solid fa-film"></i> Movie / Album Name</label>
                        <input type="text" id="albumInput" placeholder="e.g. Interstellar">
                    </div>
                    <div class="setting-group">
                        <label for="trackInput"><i class="fa-solid fa-music"></i> Track Name</label>
                        <input type="text" id="trackInput" placeholder="e.g. Stay Theme">
                    </div>
                </div>

                <button id="processBtn" class="action-btn">
                    <i class="fa-solid fa-brain"></i> Recall & Generate MIDI
                </button>

                <div id="statusMessage">
                    <div class="status-text" id="statusText"><i class="fa-solid fa-spinner fa-spin"></i> Querying LLM Musical Knowledge...</div>
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill" id="progressBarFill"></div>
                    </div>
                </div>

                <div id="resultsArea">
                    <h3><i class="fa-solid fa-file-music"></i> Generated Score</h3>
                    <!-- Div where ABCJS will inject the MIDI download button -->
                    <div id="midi-download"></div>
                </div>

            </div>
        </div>

        <div class="creator-credit">
            Symbolic MIDI Parsing by <a href="https://www.abcjs.net/" target="_blank">ABCJS</a> | Integrated & Maintained by <a href="https://tonevault.qd.je" target="_blank">ToneVault by HC</a>
        </div>

    </main>

    <site-footer></site-footer>
    <script src="/components.js"></script>

    <script type="module">
        const processBtn = document.getElementById("processBtn");
        const statusMessage = document.getElementById("statusMessage");
        const statusText = document.getElementById("statusText");
        const progressBarFill = document.getElementById("progressBarFill");
        const resultsArea = document.getElementById("resultsArea");
        const albumInput = document.getElementById("albumInput");
        const trackInput = document.getElementById("trackInput");

        processBtn.addEventListener("click", () => {
            if (!albumInput.value || !trackInput.value) {
                alert("Please enter both a Movie/Album name and a Track name.");
                return;
            }

            processBtn.setAttribute("disabled", "true");
            statusMessage.style.display = "block";
            resultsArea.style.display = "none";
            
            progressBarFill.style.width = "30%";
            statusText.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Querying AI knowledge base for "${trackInput.value}"...`;

            // SIMULATED AI API CALL
            setTimeout(() => {
                progressBarFill.style.width = "70%";
                statusText.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Converting ABC notation to MIDI...`;

                setTimeout(() => {
                    // This is the raw text an LLM would return based on the prompt.
                    // Hardcoded to Hans Zimmer's Interstellar "Stay" repeating arpeggio motif.
                    const aiGeneratedAbcText = `
X: 1
T: ${albumInput.value} - ${trackInput.value}
M: 4/4
L: 1/8
Q: 1/4=96
K: Dmin
|: "Dm" D A d A D A d A | "C" C G c G C G c G | "Bb" B, F B F B, F B F | "F" F, C F C F, C F C :|
`;

                    // ABCJS directly converts the text into a downloadable MIDI file
                    ABCJS.renderMidi("midi-download", aiGeneratedAbcText, {
                        generateDownload: true,
                        generateInline: false,
                        downloadLabel: "Download MIDI File"
                    });

                    progressBarFill.style.width = "100%";
                    statusText.innerHTML = `<i class="fa-solid fa-circle-check" style="color:#00d4ff;"></i> MIDI Ready!`;

                    setTimeout(() => {
                        statusMessage.style.display = "none";
                        progressBarFill.style.width = "0%";
                        resultsArea.style.display = "block";
                        processBtn.removeAttribute("disabled");
                    }, 800);

                }, 1000);
            }, 1000);
        });
    </script>
</body>
</html>
