<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn to Play | ToneVault AI Studio</title>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tone.js for Real-time Synthesis -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <!-- Global Stylesheet -->
    <link rel="stylesheet" href="/style.css">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #08080c;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto 40px auto;
            padding: 0 15px;
        }

        /* Header / Stats Dashboard */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .title-group h1 {
            font-size: 2.2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .title-group h1 span {
            color: #00d4ff;
        }

        .stats-bar {
            display: flex;
            gap: 15px;
            background: rgba(20, 20, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 18px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
        }

        .stat-val {
            font-size: 1.15rem;
            font-weight: 700;
            color: #00d4ff;
            font-family: monospace;
        }

        /* Controls Ribbon */
        .controls-ribbon {
            background: rgba(20, 20, 25, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .control-group-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            flex: 1;
        }

        .control-element {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-element select, .control-element input[type="number"] {
            background: rgba(10, 10, 15, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
        }

        .control-element select:focus, .control-element input[type="number"]:focus {
            border-color: #00d4ff;
        }

        .primary-btn {
            background: linear-gradient(135deg, #00d4ff, #0077ff);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            padding: 10px 22px;
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, opacity 0.2s;
            white-space: nowrap;
        }

        .primary-btn:hover {
            transform: scale(1.03);
            opacity: 0.95;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 10px 22px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.85rem;
        }

        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .btn-icon.active {
            background: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
            color: #00d4ff;
        }

        /* Sub-Ribbon for Audio Settings */
        .audio-ribbon {
            background: rgba(15, 15, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 10px 20px;
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* Stage Area (Canvas + Piano) */
        .stage-wrapper {
            background: rgba(12, 12, 18, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .canvas-scroll-container {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
            scrollbar-color: #00d4ff rgba(20, 20, 25, 0.8);
        }

        #fallingCanvas {
            display: block;
            background: radial-gradient(circle at bottom, rgba(0, 212, 255, 0.04) 0%, rgba(5, 5, 10, 0.95) 75%);
        }

        /* Overlays */
        .overlay-banner {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 8rem;
            font-weight: 900;
            color: #00d4ff;
            z-index: 20;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.8);
            pointer-events: none;
        }

        .loading-banner {
            font-size: 2rem;
            flex-direction: column;
            gap: 15px;
        }
        
        .loading-banner span {
            font-size: 1rem;
            color: #aaa;
            font-weight: 400;
            text-shadow: none;
        }

        /* Virtual Piano Keyboard */
        .keyboard-wrapper {
            position: relative;
            width: 100%;
            height: 180px;
            background: #111;
            border-top: 2px solid #00d4ff;
            user-select: none;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
            scrollbar-color: #00d4ff rgba(20, 20, 25, 0.8);
        }

        .piano {
            display: flex;
            position: relative;
            height: 100%;
            margin: 0 auto;
        }

        .key {
            position: relative;
            cursor: pointer;
            transition: background-color 0.08s ease, transform 0.05s ease;
        }

        .white-key {
            height: 100%;
            background: #fdfdfd;
            border: 1px solid #222;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 8px;
            font-size: 0.7rem;
            color: #777;
            font-weight: bold;
            flex-shrink: 0;
        }

        .white-key.active {
            background: #00d4ff !important;
            color: #000 !important;
            box-shadow: 0 0 20px #00d4ff;
        }

        .black-key {
            position: absolute;
            height: 60%;
            background: #181818;
            border: 1px solid #000;
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 6px;
            font-size: 0.62rem;
            color: #aaa;
        }

        .black-key.active {
            background: #0077ff !important;
            color: #fff !important;
            box-shadow: 0 0 15px #0077ff;
        }

        .key-hint {
            font-size: 0.6rem;
            opacity: 0.6;
            margin-top: 2px;
        }

        .waiting-badge {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 212, 255, 0.15);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 600;
            display: none;
            z-index: 10;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.04); }
        }

        .midi-badge {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #888;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .midi-badge.connected {
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.3);
            background: rgba(16, 185, 129, 0.1);
        }
    </style>
</head>
<body>

    <!-- UNIVERSAL HEADER -->
    <site-header></site-header>

    <div class="container">
        
        <!-- Header & Real-time Scoreboard -->
        <div class="dashboard-header">
            <div class="title-group">
                <h1>Learn to <span>Play</span></h1>
                <span style="font-size: 0.9rem; color: #888;">Interactive Piano & MIDI Studio</span>
            </div>

            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-label">Accuracy</span>
                    <span class="stat-val" id="statAccuracy">100%</span>
                </div>
                <div class="stat-item" style="border-left: 1px solid #333; padding-left: 15px;">
                    <span class="stat-label">Streak</span>
                    <span class="stat-val" id="statStreak">0</span>
                </div>
                <div class="stat-item" style="border-left: 1px solid #333; padding-left: 15px;">
                    <span class="stat-label">Score</span>
                    <span class="stat-val" id="statScore">0</span>
                </div>
            </div>
        </div>

        <!-- Audio Settings Sub-Ribbon -->
        <div class="audio-ribbon">
            <div class="control-element">
                <label for="instrumentSelect" style="font-size: 0.85rem; color: #aaa;"><i class="fa-solid fa-sliders"></i> Instrument:</label>
                <select id="instrumentSelect">
                    <option value="grandpiano" selected>Grand Piano — Concert (Default)</option>
                    <option value="electricpiano">Electric Piano</option>
                    <option value="softpiano">Soft Grand Piano</option>
                    <option value="strings">Warm Strings</option>
                    <option value="pad">Cinematic Pad</option>
                    <option value="bell">Soft Bell</option>
                </select>
            </div>
            <div class="control-element">
                <label for="metronomeSoundSelect" style="font-size: 0.85rem; color: #aaa;"><i class="fa-solid fa-wave-square"></i> Metronome Sound:</label>
                <select id="metronomeSoundSelect">
                    <option value="digital" selected>Digital Click (Default)</option>
                    <option value="woodblock">Classic Woodblock</option>
                    <option value="drum">Kick Drum</option>
                </select>
            </div>
        </div>

        <!-- Controls Ribbon -->
        <div class="controls-ribbon">
            <div class="control-group-left">
                <div class="control-element">
                    <label for="songSelect" style="font-size: 0.85rem; color: #aaa;">Piece:</label>
                    <select id="songSelect">
                        <option value="odeToJoy">Beethoven — Ode to Joy (Beginner)</option>
                        <option value="cMajorScale">C Major Scale (Ascending & Descending)</option>
                        <option value="messedUpHook">ToneVault — "Messed Up" Hook (EDM Riff)</option>
                    </select>
                </div>

                <div class="control-element">
                    <label for="playModeSelect" style="font-size: 0.85rem; color: #aaa;">Mode:</label>
                    <select id="playModeSelect">
                        <option value="wait" selected>Wait for Right Key</option>
                        <option value="continuous">Continuous Flow</option>
                    </select>
                </div>

                <div class="control-element">
                    <label for="keyboardSizeSelect" style="font-size: 0.85rem; color: #aaa;">Range:</label>
                    <select id="keyboardSizeSelect">
                        <option value="auto" selected>Auto</option>
                        <option value="25">25-Key</option>
                        <option value="49">49-Key</option>
                        <option value="61">61-Key</option>
                        <option value="88">88-Key</option>
                    </select>
                </div>

                <div class="control-element">
                    <label for="tempoInput" style="font-size: 0.85rem; color: #aaa;">Tempo:</label>
                    <input type="number" id="tempoInput" min="30" max="300" style="width: 70px;">
                    <button id="btnResetTempo" class="btn-icon" title="Reset to Song Default">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                </div>

                <div class="control-element">
                    <button id="btnMetronome" class="btn-icon" title="Toggle Metronome">
                        <i class="fa-solid fa-stopwatch"></i> Metronome
                    </button>
                </div>

                <div class="control-element">
                    <div id="midiStatus" class="midi-badge">
                        <i class="fa-solid fa-circle-dot"></i> MIDI: Inactive
                    </div>
                </div>
            </div>

            <div style="display: flex; gap: 10px;">
                <button id="btnDemo" class="btn-secondary">
                    <i class="fa-solid fa-eye"></i> Watch Demo
                </button>
                <button id="btnPlay" class="primary-btn">
                    <i class="fa-solid fa-play"></i> Start Practice
                </button>
            </div>
        </div>

        <!-- Main Stage: Falling Notes Canvas & Virtual Piano -->
        <div class="stage-wrapper">
            
            <div id="countdownBanner" class="overlay-banner">3</div>
            
            <div id="loadingBanner" class="overlay-banner loading-banner">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <span>Loading High-Quality Audio Samples...</span>
            </div>

            <div id="waitingBanner" class="waiting-badge">
                <i class="fa-solid fa-hand"></i> Press <span id="waitingNoteName" style="color:#fff; text-decoration: underline;">C4</span>
            </div>

            <div class="canvas-scroll-container" id="canvasScrollContainer">
                <canvas id="fallingCanvas"></canvas>
            </div>
            
            <div class="keyboard-wrapper" id="keyboardScrollContainer">
                <div class="piano" id="pianoKeyboard">
                    <!-- Keys dynamically injected -->
                </div>
            </div>
        </div>

    </div>

    <!-- UNIVERSAL FOOTER -->
    <site-footer></site-footer>

    <script src="/components.js"></script>

    <!-- Core Interactive Engine -->
    <script>
        // ==========================================
        // 1. KEYBOARD & SONG DATA
        // ==========================================
        const KEYBOARD_RANGES = {
            "25": { startMidi: 60, endMidi: 84, whiteKeyWidth: 50 },  // C4 to C6
            "49": { startMidi: 36, endMidi: 84, whiteKeyWidth: 32 },  // C2 to C6
            "61": { startMidi: 36, endMidi: 96, whiteKeyWidth: 26 },  // C2 to C7
            "88": { startMidi: 21, endMidi: 108, whiteKeyWidth: 19 }  // A0 to C8
        };

        const QWERTY_MAP = {
            'a': 'C4', 'w': 'C#4', 's': 'D4', 'e': 'D#4', 'd': 'E4', 'f': 'F4',
            't': 'F#4', 'g': 'G4', 'y': 'G#4', 'h': 'A4', 'u': 'A#4', 'j': 'B4',
            'k': 'C5', 'o': 'C#5', 'l': 'D5', 'p': 'D#5', ';': 'E5', "'": 'F5'
        };

        const SONGS = {
            odeToJoy: {
                tempo: 110,
                notes: [
                    { note: "E4", time: 1.0, dur: 0.4 }, { note: "E4", time: 1.5, dur: 0.4 },
                    { note: "F4", time: 2.0, dur: 0.4 }, { note: "G4", time: 2.5, dur: 0.4 },
                    { note: "G4", time: 3.0, dur: 0.4 }, { note: "F4", time: 3.5, dur: 0.4 },
                    { note: "E4", time: 4.0, dur: 0.4 }, { note: "D4", time: 4.5, dur: 0.4 },
                    { note: "C4", time: 5.0, dur: 0.4 }, { note: "C4", time: 5.5, dur: 0.4 },
                    { note: "D4", time: 6.0, dur: 0.4 }, { note: "E4", time: 6.5, dur: 0.4 },
                    { note: "E4", time: 7.0, dur: 0.6 }, { note: "D4", time: 7.8, dur: 0.2 },
                    { note: "D4", time: 8.2, dur: 0.8 }
                ]
            },
            cMajorScale: {
                tempo: 90,
                notes: [
                    { note: "C4", time: 1.0, dur: 0.4 }, { note: "D4", time: 1.5, dur: 0.4 },
                    { note: "E4", time: 2.0, dur: 0.4 }, { note: "F4", time: 2.5, dur: 0.4 },
                    { note: "G4", time: 3.0, dur: 0.4 }, { note: "A4", time: 3.5, dur: 0.4 },
                    { note: "B4", time: 4.0, dur: 0.4 }, { note: "C5", time: 4.5, dur: 0.8 },
                    { note: "B4", time: 5.5, dur: 0.4 }, { note: "A4", time: 6.0, dur: 0.4 },
                    { note: "G4", time: 6.5, dur: 0.4 }, { note: "F4", time: 7.0, dur: 0.4 },
                    { note: "E4", time: 7.5, dur: 0.4 }, { note: "D4", time: 8.0, dur: 0.4 },
                    { note: "C4", time: 8.5, dur: 0.8 }
                ]
            },
            messedUpHook: {
                tempo: 126,
                notes: [
                    { note: "A4", time: 1.0, dur: 0.3 }, { note: "C5", time: 1.35, dur: 0.3 },
                    { note: "E5", time: 1.7, dur: 0.5 }, { note: "D5", time: 2.3, dur: 0.3 },
                    { note: "C5", time: 2.7, dur: 0.3 }, { note: "B4", time: 3.1, dur: 0.6 },
                    { note: "G4", time: 3.8, dur: 0.3 }, { note: "A4", time: 4.2, dur: 0.9 }
                ]
            }
        };

        // ==========================================
        // 2. ADVANCED TONE.JS AUDIO ENGINE
        // ==========================================
        let currentInstrument = null;
        let masterBus = null;
        let metronomeWoodblock, metronomeDigital, metronomeDrum;
        let pianoSamples = null;
        let pianoSamplesLoading = null;
        
        const SALAMANDER_PIANO_URL = "https://tonejs.github.io/audio/salamander/";

        async function loadPianoSamples() {
            if (pianoSamples) return pianoSamples;
            if (pianoSamplesLoading) return pianoSamplesLoading;

            pianoSamplesLoading = new Promise((resolve, reject) => {
                const sampleUrls = {
                    C4: "C4.mp3", "D#4": "Ds4.mp3", "F#4": "Fs4.mp3", A4: "A4.mp3",
                    C5: "C5.mp3", "D#5": "Ds5.mp3", "F#5": "Fs5.mp3", A5: "A5.mp3"
                };

                const entries = Object.entries(sampleUrls);
                Promise.all(entries.map(async ([note, filename]) => {
                    const response = await fetch(SALAMANDER_PIANO_URL + filename);
                    if (!response.ok) throw new Error(`Sample failed: ${filename}`);
                    const arrayBuffer = await response.arrayBuffer();
                    const audioBuffer = await Tone.getContext().rawContext.decodeAudioData(arrayBuffer);
                    return [note, audioBuffer];
                }))
                .then(results => {
                    pianoSamples = Object.fromEntries(results);
                    resolve(pianoSamples);
                })
                .catch(reject);
            });
            return pianoSamplesLoading;
        }

        async function initAudio(instrumentType) {
            if (!masterBus) {
                const reverb = new Tone.Reverb({ decay: 2.5, preDelay: 0.01, wet: 0.2 }).toDestination();
                const delay = new Tone.FeedbackDelay({ delayTime: "8n", feedback: 0.1, wet: 0.05 }).connect(reverb);
                const compressor = new Tone.Compressor({ threshold: -18, ratio: 2.5 }).connect(delay);
                masterBus = new Tone.Gain(0.9).connect(compressor);

                metronomeWoodblock = new Tone.MembraneSynth({ pitchDecay: 0.008, envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination();
                metronomeWoodblock.volume.value = -5;

                metronomeDigital = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "square" }, envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.05 } }).toDestination();
                metronomeDigital.volume.value = -12;

                metronomeDrum = new Tone.MembraneSynth({ pitchDecay: 0.05, envelope: { attack: 0.001, decay: 0.4, sustain: 0.01, release: 1.4 } }).toDestination();
                metronomeDrum.volume.value = -2;
            }

            if (currentInstrument) {
                currentInstrument.dispose();
                currentInstrument = null;
            }

            if (instrumentType === "grandpiano" || instrumentType === "softpiano") {
                document.getElementById("loadingBanner").style.display = "flex";
                const loadedSamples = await loadPianoSamples();
                
                if (instrumentType === "grandpiano") {
                    currentInstrument = new Tone.Sampler({ urls: loadedSamples, attack: 0.002, release: 1.8 }).connect(masterBus);
                } else {
                    const filter = new Tone.Filter({ type: "lowpass", frequency: 5000, rolloff: -12 }).connect(masterBus);
                    currentInstrument = new Tone.Sampler({ urls: loadedSamples, attack: 0.008, release: 2.2 }).connect(filter);
                    currentInstrument.volume.value = -2;
                }
                document.getElementById("loadingBanner").style.display = "none";
            } 
            else if (instrumentType === "electricpiano") {
                currentInstrument = new Tone.PolySynth(Tone.FMSynth, {
                    harmonicity: 2.5, modulationIndex: 1.5, oscillator: { type: "sine" },
                    envelope: { attack: 0.01, decay: 1.2, sustain: 0.45, release: 1.8 }
                }).connect(masterBus);
                currentInstrument.volume.value = -4;
            } 
            else if (instrumentType === "strings") {
                currentInstrument = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "triangle" }, envelope: { attack: 0.35, decay: 0.5, sustain: 0.65, release: 2.5 }
                }).connect(masterBus);
                currentInstrument.volume.value = -8;
            } 
            else if (instrumentType === "pad") {
                currentInstrument = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "sine" }, envelope: { attack: 0.8, decay: 1.2, sustain: 0.7, release: 3.5 }
                }).connect(masterBus);
                currentInstrument.volume.value = -10;
            } 
            else if (instrumentType === "bell") {
                currentInstrument = new Tone.PolySynth(Tone.MetalSynth, {
                    frequency: 250, envelope: { attack: 0.001, decay: 1.8, release: 2.0 },
                    harmonicity: 5.1, modulationIndex: 12, resonance: 3500, octaves: 1.5
                }).connect(masterBus);
                currentInstrument.volume.value = -12;
            }
        }

        // ==========================================
        // 3. DOM ELEMENTS & STATE MANAGEMENT
        // ==========================================
        const canvas = document.getElementById("fallingCanvas");
        const ctx = canvas.getContext("2d");
        const pianoEl = document.getElementById("pianoKeyboard");
        const canvasScrollContainer = document.getElementById("canvasScrollContainer");
        const keyboardScrollContainer = document.getElementById("keyboardScrollContainer");

        const btnPlay = document.getElementById("btnPlay");
        const btnDemo = document.getElementById("btnDemo");
        const btnMetronome = document.getElementById("btnMetronome");
        const btnResetTempo = document.getElementById("btnResetTempo");
        const songSelect = document.getElementById("songSelect");
        const playModeSelect = document.getElementById("playModeSelect");
        const keyboardSizeSelect = document.getElementById("keyboardSizeSelect");
        const instrumentSelect = document.getElementById("instrumentSelect");
        const metronomeSoundSelect = document.getElementById("metronomeSoundSelect");
        const tempoInput = document.getElementById("tempoInput");

        const statAccuracy = document.getElementById("statAccuracy");
        const statStreak = document.getElementById("statStreak");
        const statScore = document.getElementById("statScore");
        const midiBadge = document.getElementById("midiStatus");
        
        const waitingBanner = document.getElementById("waitingBanner");
        const waitingNoteName = document.getElementById("waitingNoteName");
        const countdownBanner = document.getElementById("countdownBanner");

        let keyPositions = {}; 
        let isPlaying = false;
        let isDemoMode = false;
        let isWaitingForNote = false;
        let isCountingDown = false;
        let countdownTimer;
        let currentWaitTarget = null;
        let songTimeOffset = 0;
        let lastFrameTimestamp = 0;
        let activeSong = null;
        
        let currentBPM = 110;
        let speedMultiplier = 1.0;
        let isMetronomeOn = false;
        let lastBeatPlayed = -1;

        let totalExpectedNotes = 0;
        let notesHit = 0;
        let currentStreak = 0;
        let totalScore = 0;

        canvasScrollContainer.addEventListener("scroll", () => { keyboardScrollContainer.scrollLeft = canvasScrollContainer.scrollLeft; });
        keyboardScrollContainer.addEventListener("scroll", () => { canvasScrollContainer.scrollLeft = keyboardScrollContainer.scrollLeft; });

        // ==========================================
        // 4. SETTINGS CONTROLS
        // ==========================================
        function updateTempoState() {
            const defaultTempo = SONGS[songSelect.value].tempo;
            speedMultiplier = currentBPM / defaultTempo;
        }

        function resetTempo() {
            currentBPM = SONGS[songSelect.value].tempo;
            tempoInput.value = currentBPM;
            updateTempoState();
        }

        songSelect.addEventListener("change", () => {
            resetTempo();
            if (keyboardSizeSelect.value === "auto") buildDynamicPiano();
        });

        tempoInput.addEventListener("change", (e) => {
            let val = parseFloat(e.target.value);
            if (val < 30) val = 30; if (val > 300) val = 300;
            currentBPM = val;
            tempoInput.value = currentBPM;
            updateTempoState();
        });

        btnResetTempo.addEventListener("click", resetTempo);

        instrumentSelect.addEventListener("change", async (e) => {
            await Tone.start();
            await initAudio(e.target.value);
        });

        function triggerMetronomeClick(isDownbeat, time) {
            const type = metronomeSoundSelect.value;
            if (type === "woodblock") {
                metronomeWoodblock.triggerAttackRelease(isDownbeat ? "C5" : "G4", "32n", time, isDownbeat ? 1.0 : 0.6);
            } else if (type === "digital") {
                metronomeDigital.triggerAttackRelease(isDownbeat ? "C6" : "C5", "64n", time, isDownbeat ? 0.8 : 0.4);
            } else if (type === "drum") {
                metronomeDrum.triggerAttackRelease(isDownbeat ? "C2" : "G2", "16n", time, isDownbeat ? 1.0 : 0.5);
            }
        }

        btnMetronome.addEventListener("click", async () => {
            await Tone.start();
            if (!currentInstrument) await initAudio(instrumentSelect.value);
            
            isMetronomeOn = !isMetronomeOn;
            btnMetronome.classList.toggle("active", isMetronomeOn);
            
            if (isMetronomeOn && !isPlaying && !isCountingDown) {
                triggerMetronomeClick(true, Tone.now());
            }
        });

        resetTempo();

        // ==========================================
        // 5. DYNAMIC KEYBOARD GENERATION
        // ==========================================
        function getAutoSongRange(songKey) {
            const song = SONGS[songKey];
            if (!song || !song.notes.length) return KEYBOARD_RANGES["49"];
            let minMidi = 127; let maxMidi = 0;
            song.notes.forEach(n => {
                const midi = Tone.Midi(n.note).toMidi();
                if (midi < minMidi) minMidi = midi;
                if (midi > maxMidi) maxMidi = midi;
            });
            let startMidi = Math.max(21, minMidi - 7);
            let endMidi = Math.min(108, maxMidi + 7);
            while (endMidi - startMidi < 24) {
                if (startMidi > 21) startMidi--;
                if (endMidi < 108) endMidi++;
            }
            let whiteCount = 0;
            for (let i = startMidi; i <= endMidi; i++) if (!Tone.Midi(i).toNote().includes('#')) whiteCount++;
            let calcWidth = Math.floor(1000 / whiteCount);
            if (calcWidth > 55) calcWidth = 55; if (calcWidth < 19) calcWidth = 19;
            return { startMidi, endMidi, whiteKeyWidth: calcWidth };
        }

        function buildDynamicPiano() {
            pianoEl.innerHTML = "";
            keyPositions = {};
            let rangeConfig = keyboardSizeSelect.value === "auto" ? getAutoSongRange(songSelect.value) : KEYBOARD_RANGES[keyboardSizeSelect.value];
            const whiteWidth = rangeConfig.whiteKeyWidth;
            const blackWidth = whiteWidth * 0.65;
            let whiteKeys = []; let blackKeys = []; let whiteIndex = 0;

            for (let midi = rangeConfig.startMidi; midi <= rangeConfig.endMidi; midi++) {
                const noteName = Tone.Midi(midi).toNote();
                if (!noteName.includes("#")) whiteKeys.push({ midi, note: noteName, whiteIndex: whiteIndex++ });
                else blackKeys.push({ midi, note: noteName, prevWhiteIndex: whiteIndex - 1 });
            }

            const totalPianoWidth = whiteIndex * whiteWidth;
            pianoEl.style.width = `${totalPianoWidth}px`;
            canvas.width = Math.max(totalPianoWidth, canvasScrollContainer.clientWidth);
            canvas.height = 380;
            const xOffset = Math.max(0, (canvas.width - totalPianoWidth) / 2);

            whiteKeys.forEach(k => {
                const keyDiv = document.createElement("div"); keyDiv.className = "key white-key"; keyDiv.id = `key-${k.note}`; keyDiv.style.width = `${whiteWidth}px`;
                const qwertyKey = Object.keys(QWERTY_MAP).find(key => QWERTY_MAP[key] === k.note);
                keyDiv.innerHTML = `<span>${k.note}</span>${qwertyKey ? `<span class="key-hint">${qwertyKey.toUpperCase()}</span>` : ''}`;
                keyDiv.addEventListener("mousedown", () => handleUserNoteOn(k.note));
                keyDiv.addEventListener("mouseup", () => handleUserNoteOff(k.note));
                pianoEl.appendChild(keyDiv);
                keyPositions[k.note] = { x: xOffset + (k.whiteIndex * whiteWidth), w: whiteWidth, isBlack: false };
            });

            blackKeys.forEach(k => {
                const keyDiv = document.createElement("div"); keyDiv.className = "key black-key"; keyDiv.id = `key-${k.note}`; keyDiv.style.width = `${blackWidth}px`;
                const leftPos = (k.prevWhiteIndex * whiteWidth) + (whiteWidth - (blackWidth / 2)); keyDiv.style.left = `${leftPos}px`;
                const qwertyKey = Object.keys(QWERTY_MAP).find(key => QWERTY_MAP[key] === k.note);
                keyDiv.innerHTML = `<span>${k.note}</span>${qwertyKey ? `<span class="key-hint">${qwertyKey.toUpperCase()}</span>` : ''}`;
                keyDiv.addEventListener("mousedown", () => handleUserNoteOn(k.note));
                keyDiv.addEventListener("mouseup", () => handleUserNoteOff(k.note));
                pianoEl.appendChild(keyDiv);
                keyPositions[k.note] = { x: xOffset + leftPos, w: blackWidth, isBlack: true };
            });

            if (totalPianoWidth > canvasScrollContainer.clientWidth) {
                const centerScroll = (totalPianoWidth - canvasScrollContainer.clientWidth) / 2;
                canvasScrollContainer.scrollLeft = centerScroll; keyboardScrollContainer.scrollLeft = centerScroll;
            }
        }

        keyboardSizeSelect.addEventListener("change", buildDynamicPiano);
        window.addEventListener("resize", buildDynamicPiano);
        buildDynamicPiano();

        // ==========================================
        // 6. NOTE TRIGGERING & SCORING
        // ==========================================
        async function handleUserNoteOn(note) {
            await Tone.start();
            if (!currentInstrument) await initAudio(instrumentSelect.value);
            
            currentInstrument.triggerAttack(note);
            const el = document.getElementById(`key-${note}`);
            if (el) el.classList.add("active");

            // Ignore scoring if user plays during Demo Mode
            if (isPlaying && activeSong && !isDemoMode) {
                if (isWaitingForNote && currentWaitTarget) {
                    if (currentWaitTarget.note === note) {
                        currentWaitTarget.hit = true;
                        isWaitingForNote = false; currentWaitTarget = null;
                        waitingBanner.style.display = "none";
                        notesHit++; currentStreak++; totalScore += 120 + (currentStreak * 10);
                        updateScoreboard();
                    }
                    return;
                }

                const target = activeSong.notes.find(n => n.note === note && Math.abs(n.time - songTimeOffset) < 0.35 && !n.hit);
                if (target) { target.hit = true; notesHit++; currentStreak++; totalScore += 100 + (currentStreak * 10); } 
                else { currentStreak = 0; }
                updateScoreboard();
            }
        }

        function handleUserNoteOff(note) {
            if (currentInstrument) currentInstrument.triggerRelease(note);
            const el = document.getElementById(`key-${note}`);
            if (el) el.classList.remove("active");
        }

        function updateScoreboard() {
            statStreak.innerText = currentStreak; statScore.innerText = totalScore;
            statAccuracy.innerText = `${totalExpectedNotes > 0 ? Math.round((notesHit / totalExpectedNotes) * 100) : 100}%`;
        }

        window.addEventListener("keydown", (e) => {
            if (e.repeat) return;
            const note = QWERTY_MAP[e.key.toLowerCase()];
            if (note && !isCountingDown) handleUserNoteOn(note);
        });

        window.addEventListener("keyup", (e) => {
            const note = QWERTY_MAP[e.key.toLowerCase()];
            if (note) handleUserNoteOff(note);
        });

        // ==========================================
        // 7. ANIMATION ENGINE & METRONOME
        // ==========================================
        const HIT_ZONE_Y = 370;
        const FALL_SPEED = 220; 

        function renderEngine(timestamp) {
            if (!lastFrameTimestamp) lastFrameTimestamp = timestamp;
            const deltaSeconds = (timestamp - lastFrameTimestamp) / 1000;
            lastFrameTimestamp = timestamp;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "rgba(0, 212, 255, 0.4)";
            ctx.lineWidth = 2; ctx.beginPath();
            ctx.moveTo(0, HIT_ZONE_Y); ctx.lineTo(canvas.width, HIT_ZONE_Y); ctx.stroke();

            if (isPlaying && activeSong) {
                if (!isWaitingForNote) {
                    songTimeOffset += deltaSeconds * speedMultiplier;
                    
                    const baseTempo = SONGS[songSelect.value].tempo;
                    const beatInterval = 60 / baseTempo; 
                    const currentBeat = Math.floor(songTimeOffset / beatInterval);
                    
                    if (currentBeat > lastBeatPlayed && songTimeOffset >= 0) {
                        lastBeatPlayed = currentBeat;
                        if (isMetronomeOn && Tone.context.state === 'running') {
                            triggerMetronomeClick(currentBeat % 4 === 0, Tone.now());
                        }
                    }
                }

                // Check Wait Mode (Bypassed if Demo Mode is active)
                if (!isDemoMode && playModeSelect.value === "wait" && !isWaitingForNote) {
                    const upcomingNote = activeSong.notes.find(n => !n.hit && (n.time - songTimeOffset) <= 0.02);
                    if (upcomingNote) {
                        isWaitingForNote = true; currentWaitTarget = upcomingNote;
                        waitingNoteName.innerText = upcomingNote.note;
                        waitingBanner.style.display = "block";
                    }
                }

                let activeNotesRemain = false;

                activeSong.notes.forEach(n => {
                    
                    // --- DEMO MODE AUTO-PLAY LOGIC ---
                    if (isDemoMode) {
                        // Note ON
                        if (!n.hit && songTimeOffset >= n.time) {
                            n.hit = true; n.demoActive = true;
                            if (currentInstrument && Tone.context.state === 'running') {
                                currentInstrument.triggerAttack(n.note);
                            }
                            const el = document.getElementById(`key-${n.note}`);
                            if (el) el.classList.add("active");
                        }
                        // Note OFF
                        if (n.demoActive && songTimeOffset >= n.time + n.dur) {
                            n.demoActive = false;
                            if (currentInstrument) currentInstrument.triggerRelease(n.note);
                            const el = document.getElementById(`key-${n.note}`);
                            if (el) el.classList.remove("active");
                        }
                    }
                    // ----------------------------------

                    const timeUntilHit = n.time - songTimeOffset;
                    const blockY = HIT_ZONE_Y - (timeUntilHit * FALL_SPEED);
                    const blockHeight = Math.max(n.dur * FALL_SPEED, 16);

                    if (blockY + blockHeight > 0 && blockY < canvas.height + 100) {
                        activeNotesRemain = true;
                        const pos = keyPositions[n.note];

                        if (pos) {
                            ctx.fillStyle = n.hit ? "#10b981" : (pos.isBlack ? "#0077ff" : "#00d4ff");
                            ctx.shadowColor = pos.isBlack ? "#0077ff" : "#00d4ff";
                            ctx.shadowBlur = 8;
                            ctx.beginPath();
                            ctx.roundRect(pos.x + 2, blockY - blockHeight, pos.w - 4, blockHeight, 5);
                            ctx.fill();
                            ctx.shadowBlur = 0;

                            if (pos.w > 15 && blockHeight > 18) {
                                ctx.fillStyle = pos.isBlack ? "#ffffff" : "#000000";
                                ctx.font = "bold 11px 'Segoe UI'";
                                ctx.textAlign = "center";
                                ctx.textBaseline = "middle";
                                ctx.fillText(n.note, pos.x + (pos.w / 2), blockY - 10);
                            }
                        }
                    }
                });

                if (!activeNotesRemain && songTimeOffset > activeSong.notes[activeSong.notes.length - 1].time + 2) {
                    stopPractice();
                }
            }
            requestAnimationFrame(renderEngine);
        }
        requestAnimationFrame(renderEngine);

        // ==========================================
        // 8. PLAYBACK & COUNTDOWN LOGIC
        // ==========================================
        async function startPractice(demo = false) {
            isDemoMode = demo;
            await Tone.start();
            if (!currentInstrument) await initAudio(instrumentSelect.value);

            // UI Changes based on mode
            if (isDemoMode) {
                btnDemo.innerHTML = '<i class="fa-solid fa-stop"></i> Stop Demo';
                btnDemo.style.background = "#ef4444";
                btnDemo.style.borderColor = "#ef4444";
                btnPlay.disabled = true; btnPlay.style.opacity = "0.5";
            } else {
                btnPlay.innerHTML = '<i class="fa-solid fa-stop"></i> Stop Practice';
                btnPlay.style.background = "#ef4444";
                btnDemo.disabled = true; btnDemo.style.opacity = "0.5";
            }

            const selectedKey = songSelect.value;
            activeSong = JSON.parse(JSON.stringify(SONGS[selectedKey]));
            totalExpectedNotes = activeSong.notes.length;
            notesHit = 0; currentStreak = 0; totalScore = 0;
            updateScoreboard();
            
            isCountingDown = true;
            isPlaying = false; 
            
            let count = 3;
            countdownBanner.style.display = "flex";
            countdownBanner.innerText = count;
            triggerMetronomeClick(true, Tone.now());

            const tickIntervalMs = 60000 / currentBPM;

            countdownTimer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownBanner.innerText = count;
                    triggerMetronomeClick(false, Tone.now());
                } else if (count === 0) {
                    countdownBanner.innerText = "GO!";
                    triggerMetronomeClick(true, Tone.now());
                } else {
                    clearInterval(countdownTimer);
                    countdownBanner.style.display = "none";
                    isCountingDown = false;
                    
                    songTimeOffset = 0;
                    lastBeatPlayed = -1;
                    lastFrameTimestamp = performance.now();
                    isPlaying = true;
                }
            }, tickIntervalMs);
        }

        function stopPractice() {
            clearInterval(countdownTimer);
            countdownBanner.style.display = "none";
            isCountingDown = false; isPlaying = false; 
            isWaitingForNote = false; currentWaitTarget = null;
            waitingBanner.style.display = "none";
            
            // Clean up any lingering active demo notes
            if (isDemoMode && activeSong) {
                activeSong.notes.forEach(n => {
                    if (n.demoActive) {
                        if (currentInstrument) currentInstrument.triggerRelease(n.note);
                        const el = document.getElementById(`key-${n.note}`);
                        if (el) el.classList.remove("active");
                    }
                });
            }
            
            activeSong = null;
            isDemoMode = false;
            
            btnPlay.disabled = false; btnPlay.style.opacity = "1";
            btnPlay.innerHTML = '<i class="fa-solid fa-play"></i> Start Practice';
            btnPlay.style.background = "linear-gradient(135deg, #00d4ff, #0077ff)";

            btnDemo.disabled = false; btnDemo.style.opacity = "1";
            btnDemo.innerHTML = '<i class="fa-solid fa-eye"></i> Watch Demo';
            btnDemo.style.background = "rgba(255, 255, 255, 0.1)";
            btnDemo.style.borderColor = "rgba(255, 255, 255, 0.2)";
        }

        btnPlay.addEventListener("click", () => {
            if (isPlaying || isCountingDown) stopPractice();
            else startPractice(false);
        });

        btnDemo.addEventListener("click", () => {
            if (isPlaying || isCountingDown) stopPractice();
            else startPractice(true);
        });

        // ==========================================
        // 9. WEB MIDI API INTEGRATION
        // ==========================================
        if (navigator.requestMIDIAccess) {
            navigator.requestMIDIAccess().then(onMIDISuccess, onMIDIFailure);
        }

        function onMIDISuccess(midiAccess) {
            const inputs = midiAccess.inputs.values();
            let count = 0;
            for (let input of inputs) {
                input.onmidimessage = handleMIDIMessage;
                count++;
            }
            updateMidiBadge(count);

            midiAccess.onstatechange = (e) => {
                if (e.port.type === "input") updateMidiBadge(Array.from(midiAccess.inputs.values()).length);
            };
        }

        function updateMidiBadge(count) {
            if (count > 0) {
                midiBadge.classList.add("connected");
                midiBadge.innerHTML = `<i class="fa-solid fa-circle-check"></i> MIDI: Active (${count})`;
            } else {
                midiBadge.classList.remove("connected");
                midiBadge.innerHTML = `<i class="fa-solid fa-circle-dot"></i> MIDI: Inactive`;
            }
        }

        function onMIDIFailure() { console.log("Web MIDI access not available."); }

        function handleMIDIMessage(event) {
            const [status, noteNumber, velocity] = event.data;
            const command = status >> 4;
            const noteName = Tone.Midi(noteNumber).toNote();
            if (command === 9 && velocity > 0 && !isCountingDown) handleUserNoteOn(noteName);
            else if (command === 8 || (command === 9 && velocity === 0)) handleUserNoteOff(noteName);
        }
    </script>
</body>
</html>
