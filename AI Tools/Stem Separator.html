<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToneVault - Stem Separator</title>
    
    <!-- FONTAWESOME ICONS CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- UNIVERSAL DESIGN EDITOR -->
    <link rel="stylesheet" href="/style.css">

    <!-- Page-Specific Styles -->
    <style>
        .page-header {
            text-align: center;
            margin-top: 60px;
            margin-bottom: 30px;
            padding: 0 20px;
        }

        .page-header h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            margin-top: 0;
            color: #ffffff;
        }

        .page-header h1 span {
            color: #00d4ff;
        }

        .page-header p {
            color: #bbbbbb;
            font-size: 1.1rem;
            max-width: 750px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* EXPANDED CONTAINER WITH DEEP CROP WRAPPER */
        .tool-wrapper {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto 30px auto;
            padding: 0 20px;
        }

        .iframe-crop-container {
            position: relative;
            width: 100%;
            height: 900px; /* Perfectly frames the main app interface */
            overflow: hidden;
            border-radius: 18px;
            background: #0a0a0a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .app-iframe {
            position: absolute;
            top: -115px; /* Pushed up further to completely cut off the top links */
            left: 0;
            width: 100%;
            height: calc(100% + 185px); /* Compensates for the deeper crop */
            border: none;
            background: transparent;
            overflow: hidden;
        }

        /* CREATOR CREDIT FOOTER LINK */
        .creator-credit {
            text-align: center;
            margin-bottom: 50px;
            font-size: 0.9rem;
            color: #888;
        }

        .creator-credit a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s ease;
        }

        .creator-credit a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        @media (max-width: 900px) {
            .page-header h1 { font-size: 2.2rem; }
            .tool-wrapper { margin-bottom: 30px; padding: 0 10px; }
            .iframe-crop-container { height: 1300px; }
        }
    </style>
</head>
<body>

    <!-- UNIVERSAL HEADER -->
    <site-header></site-header>

    <!-- PAGE CONTENT AREA -->
    <main>
        
        <!-- PAGE HEADER -->
        <div class="page-header">
            <h1>Stem <span>Separator</span></h1>
            <p>Isolate vocals, drums, bass, and synth melodies into clean audio tracks directly on this page using advanced AI models.</p>
        </div>

        <!-- EMBEDDED TOOL WITH DEEP CROPPER -->
        <div class="tool-wrapper">
            <div class="iframe-crop-container">
                <iframe 
                    src="https://ahk-d-spleeter-ht-demucs-stem-separation-2025.hf.space" 
                    class="app-iframe"
                    scrolling="no"
                    loading="lazy"
                    allow="autoplay; clipboard-write; encrypted-media; picture-in-picture" 
                    allowtransparency="true">
                </iframe>
            </div>
        </div>

        <!-- CREATOR CREDIT -->
        <div class="creator-credit">
            AI Space & Engine Created by <a href="https://huggingface.co/spaces/ahk-d/Spleeter-HT-Demucs-Stem-Separation-2025" target="_blank">ahk-d</a> | Integrated & Maintained by <a href="https://tonevault.qd.je" target="_blank">ToneVault by HC</a>
        </div>

    </main>

    <!-- UNIVERSAL FOOTER -->
    <site-footer></site-footer>

    <!-- UNIVERSAL HTML COMPONENT EDITOR -->
    <script src="/components.js"></script>

</body>
</html>
