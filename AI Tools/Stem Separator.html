    <style>
        .page-header {
            text-align: center;

            margin-bottom: 30px;

        }

        .page-header h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            margin-top: 0;
            color: #ffffff;

        .page-header h1 span {

        }

            max-width: 750px;

        .tool-wrapper {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto 30px auto;

        }

        .app-iframe {
            width: 100%;
            height: 1950px; /* Increased height to ensure zero missing content */

            background: #0a0a0a;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);

        /* HIDE PAGE SCROLLBARS */

            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s ease;
        }

        .creator-credit a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        /* RESPONSIVE HEIGHT ADJUSTMENTS FOR FULL CONTENT VISIBILITY */
        @media (max-width: 1024px) {
            .page-header h1 { font-size: 2.5rem; }
            .tool-wrapper { padding: 0 15px; }
            .app-iframe { height: 2450px; }
        }

        @media (max-width: 480px) {
            .page-header { margin-top: 40px; }
            .page-header h1 { font-size: 2rem; }
            .page-header p { font-size: 0.95rem; }
