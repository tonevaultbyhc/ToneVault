<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToneVault - Stem Separator</title>
    
    <!-- FONTAWESOME ICONS CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- UNIVERSAL DESIGN EDITOR -->
    <link rel="stylesheet" href="/style.css">

    <!-- Page-Specific Styles -->
    <style>
        .page-header {
            text-align: center;
            margin-top: 60px;
            margin-bottom: 30px;

        .page-header h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            margin-top: 0;
            color: #ffffff;

        .page-header h1 span {
            color: #00d4ff;
        }

        .page-header p {
            color: #bbbbbb;
            font-size: 1.1rem;
            max-width: 750px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* EXPANDED CONTAINER */
        .tool-wrapper {
            width: 100%;
            max-width: 1400px;

            padding: 0 20px;
        }

        .app-iframe {
            width: 100%;
            height: 980px;
            border: none;
            display: block;

            .page-header h1 { font-size: 2.2rem; }

<body>

    <!-- UNIVERSAL HEADER -->
    <site-header></site-header>
